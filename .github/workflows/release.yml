name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches metadata.json version
        id: version
        run: |
          version=$(jq -r .KPlugin.Version package/metadata.json)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match metadata.json version ${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build .plasmoid
        run: |
          cd package
          zip -r -X "../netmeter-${{ steps.version.outputs.version }}.plasmoid" .

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${GITHUB_REF_NAME}"
          "netmeter-${{ steps.version.outputs.version }}.plasmoid"
          --title "Net Meter ${{ steps.version.outputs.version }}"
          --generate-notes --verify-tag
